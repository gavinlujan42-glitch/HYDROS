name: Deploy HYDROS Secure Intake

on:
  workflow_dispatch:
    inputs:
      region:
        description: Cloud Run region
        required: false
        default: us-central1

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intake-api
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy scanner
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region }}
          RUNTIME_SA: ${{ secrets.HYDROS_RUNTIME_SERVICE_ACCOUNT }}
          ALLOWED_ORIGINS: https://gavinlujan42-glitch.github.io
        run: bash deploy-cloud-run.sh

      - name: Discover service URL
        id: url
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region }}
        run: |
          gcloud config set project "$PROJECT_ID"
          URL=$(gcloud run services describe hydros-secure-intake --region "$REGION" --format='value(status.url)')
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Security smoke tests
        run: bash smoke-test.sh "${{ steps.url.outputs.url }}"

      - name: Publish backend endpoint to GitHub Pages
        env:
          SERVICE_URL: ${{ steps.url.outputs.url }}
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/hydros-pages origin/gh-pages
          cat > /tmp/hydros-pages/hydros-config.js <<EOF
          // Auto-generated by Deploy HYDROS Secure Intake. Do not edit by hand.
          window.HYDROS_CONFIG = Object.freeze({
            uploadApi: "${SERVICE_URL}",
            uploadMode: "backend-only",
            repository: "Google Drive",
            security: "ClamAV + YARA + MIME/archive validation + SHA-256"
          });
          EOF
          cd /tmp/hydros-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hydros-config.js
          if git diff --cached --quiet; then
            echo "HYDROS runtime config already points to this service."
          else
            git commit -m "Configure HYDROS secure intake backend"
            git push origin HEAD:gh-pages
          fi

      - name: Deployment summary
        run: |
          echo "### HYDROS Secure Intake" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend: ${{ steps.url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: ${{ steps.url.outputs.url }}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "Google Drive access: backend runtime identity only" >> "$GITHUB_STEP_SUMMARY"
          echo "Browser OAuth: disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Blocked-file and EICAR malware smoke tests passed before the Pages endpoint was published." >> "$GITHUB_STEP_SUMMARY"
